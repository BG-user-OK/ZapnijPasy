<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zapnij Pasy">
  <meta name="application-name" content="Zapnij Pasy">
  <meta name="description" content="Spokojny, mechaniczny zegar klapkowy.">
  <meta name="app-version" content="vGPT_2.13.0">
  <title>Zapnij Pasy</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./Grafiki/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./Grafiki/icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=vGPT_2.13.0">
  <script type="module" src="./js/app.js?v=vGPT_2.13.0"></script>
</head>
<body>
  <main class="stage" data-mode="clock" aria-label="Zapnij Pasy">
  <section class="clock" id="clock-view" role="timer" aria-live="off" aria-label="Zegar">
    <div class="digit hours" aria-hidden="true"></div>
    <div class="digit minutes" aria-hidden="true"></div>
  </section>
  <section class="signs" id="signs-view" aria-label="Komunikaty" aria-hidden="true"></section>
  <button class="mode-toggle" type="button" aria-controls="clock-view signs-view" aria-pressed="false" aria-label="Nowy pasażer — pokaż przypomnienie o pasach" disabled></button>
  <button class="brightness-toggle" type="button" aria-haspopup="dialog" aria-controls="brightness-panel" aria-expanded="false" aria-label="Jasność"></button>
  <button class="layout-toggle" type="button" aria-pressed="false" aria-label="Przełącz układ pionowy i poziomy" disabled></button>
  <button class="clock-only-toggle" type="button" aria-pressed="false" aria-label="Jadę sam — tylko zegar" disabled></button>
  </main>
  <noscript>Włącz JavaScript, aby wyświetlić zegar.</noscript>
</body>
</html>
